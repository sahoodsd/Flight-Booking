name: ci

on:
  push:
  pull_request:

jobs:
  test:

    services:
        postgres:
            image: postgres:16
            env:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: flight_booking_test
            ports:
                - 5432:5432
            options: >-
                --health-cmd pg_isready
                --health-interval 5s
                --health-timeout 5s
                --health-retries 10
    
    env:
        DATABASE_URL: 
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci
      - run: npm run migrate
      - run: npm test
